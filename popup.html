<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bloktra</title>
  <link rel="stylesheet" href="assets/ui.css">
  <link rel="stylesheet" href="popup.css">
  <script src="assets/theme.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4.5 5.4v6.1c0 4.6 3.1 8.7 7.5 10 4.4-1.3 7.5-5.4 7.5-10V5.4L12 2.5Z" fill="currentColor"/><path d="m8.6 12.2 2.4 2.4 4.6-4.8" fill="none" stroke="var(--surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Bloktra</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="openDashboard" title="Dashboard" aria-label="Open dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      </button>
      <button class="icon-btn" id="globalPower" title="Pause Bloktra everywhere" aria-label="Pause Bloktra everywhere">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
      </button>
    </div>
  </header>

  <div class="banner" id="pausedBanner" hidden>
    <span>Bloktra is paused everywhere.</span>
    <button class="btn primary sm" id="resumeAll">Resume</button>
  </div>

  <main id="main">
    <section class="site card" id="siteCard">
      <div class="site-info">
        <div class="host" id="host">—</div>
        <div class="state" id="state"><span class="state-dot"></span><span id="stateText">Loading…</span></div>
      </div>
      <button class="power" id="sitePower" role="switch" aria-checked="true" aria-label="Protection on this site">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3.5v7.5"/><path d="M6.6 7a7.5 7.5 0 1 0 10.8 0"/></svg>
      </button>
    </section>

    <div class="banner subtle" id="reloadBanner" hidden>
      <span>Reload the page to apply.</span>
      <button class="btn sm" id="reload">Reload</button>
    </div>

    <section class="card count" id="countCard">
      <div class="count-head">
        <div class="big num" id="pageBlocked">0</div>
        <div class="label">blocked on this page</div>
      </div>
      <div class="bar" id="bar" aria-hidden="true">
        <span class="seg ads" id="segAds"></span><span class="seg trackers" id="segTrackers"></span>
      </div>
      <div class="legend">
        <div class="item"><span class="dot ads"></span><span>Ads</span><b class="num" id="pageAds">0</b></div>
        <div class="item"><span class="dot trackers"></span><span>Trackers</span><b class="num" id="pageTrackers">0</b></div>
        <div class="item"><span class="dot hidden"></span><span>Hidden</span><b class="num" id="pageHidden">0</b></div>
      </div>
    </section>

    <details class="card domains" id="domainsCard">
      <summary>
        <span>Blocked domains</span>
        <span class="faint num" id="domainCount">0</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <ul id="domainList"></ul>
    </details>

    <section class="unsupported card" id="unsupported" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
      <div>
        <b>Nothing to block here</b>
        <div class="muted">Bloktra works on regular websites. Browser pages and the extension store are off limits.</div>
      </div>
    </section>

    <div class="actions">
      <button class="btn" id="pick">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l7 17 2.5-7.5L21 11 4 4Z"/></svg>
        Hide an element
      </button>
      <button class="btn" id="filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
        Filters
      </button>
    </div>
  </main>

  <footer class="foot">
    <span><b class="num" id="totalBlocked">0</b> blocked all time</span>
    <span class="faint" id="today"></span>
  </footer>

  <p class="error" id="error" role="status" hidden></p>
  <script src="popup.js" type="module"></script>
</body>
</html>
